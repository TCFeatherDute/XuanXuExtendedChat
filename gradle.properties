# Gradle
# 强制 Gradle 使用 JDK 21，避免 IDE 自动选择 JDK 25 导致 NeoForge 1.21.1 构建异常
org.gradle.java.home=C:/Program Files/Java/latest/jdk-21
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true
# If you run into configuration cache issues with NeoForge, set this to false.
org.gradle.configuration-cache=true

# 网络代理（Clash for Windows 默认混合端口 7890）
# 下载 NeoForge / Minecraft 依赖需要访问 maven.neoforged.net，直连会被重置，
# 因此这里让 Gradle 走本地代理。使用前请确保 Clash 已开启。
# 如果不想用代理，把下面 5 行注释掉即可。
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.0.0.1|[::1]

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.234
neo_version_range=[21.1.0,21.2.0)
loader_version_range=[4,)

# Mod
mod_id=xuanxuchat
# 注意：Java properties 文件按 ISO-8859-1 读取，中文必须写成 \uXXXX 转义，
# 否则会被 Gradle 读成乱码并写进 mods.toml。
# 当前值 = "玄虚扩展 - TC的多人聊天革新"
mod_name=\u7384\u865a\u6269\u5c55 - TC\u7684\u591a\u4eba\u804a\u5929\u9769\u65b0
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.tc.xuanxuchat
mod_authors=TC
mod_description=A chat-app style chat interface for Minecraft, replacing the vanilla chat screen.
